name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  app-tests:
    name: App build + tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          # Tests import .ts sources directly under node --test (type
          # stripping is unflagged from Node 23.6).
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test

  scraper-tests:
    name: Scraper tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv run --directory scraper pytest tests
