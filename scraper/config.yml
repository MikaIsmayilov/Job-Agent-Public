prune:
  # `prune` deletes stored jobs that fail current filters, plus untouched
  # "new" postings older than this. Shortlisted/ready/applied jobs are never
  # auto-removed.
  stale_after_days: 21

relevance:
  # A posting is kept only if its title contains one of these tokens.
  # /onboard fills this from your role families. Note a token must be a
  # substring: "data science" does NOT match "data scientist".
  title_keywords: []
