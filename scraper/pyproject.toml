[project]
name = "jobagent-scraper"
version = "0.1.0"
description = "Job Agent scraping sidecar: job boards via python-jobspy plus direct company ATS connectors."
requires-python = ">=3.10"
dependencies = [
    "python-jobspy>=1.1.80",
    "pyyaml>=6.0",
    "requests>=2.32",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
# Guarantee the package resolves during collection regardless of cwd or the
# venv's editable-install state (the .pth can silently break on resync).
pythonpath = ["."]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["jobagent_scraper"]
