# Company career-site registry. One line per company; the connector for its ATS
# does the rest. Grow this list by hand or with:  pnpm scrape:discover
#
# Fields per ATS:
#   greenhouse / lever / ashby / workable / recruitee / smartrecruiters: token
#   workday: tenant, wd (wd1/wd2/wd3/wd5), site
#   phenom: base_url
#   company_site (generic JSON-LD crawler): careers_url
#
# Entries failing verification are skipped at runtime with a logged warning —
# a wrong token never breaks the run.
#
# This file is the core list: employers that hire across the US or remotely.
# City- and country-specific employers live in opt-in packs under
# scraper/companies/<region>.yml (boston, canada, ...), switched on with
# config.yml `ats.regions`. /onboard picks packs from your places and adds
# companies you name here.

companies:
  # ---- Big 4 / consulting ----
  - { name: "PwC", ats: phenom, base_url: "https://jobs-us.pwc.com" }
  - { name: "Deloitte", ats: company_site, careers_url: "https://apply.deloitte.com/en_US/careers" }
  - { name: "EY", ats: company_site, careers_url: "https://careers.ey.com/ey/search/?q=analyst" }
  - { name: "KPMG US", ats: company_site, careers_url: "https://www.kpmguscareers.com/job-search/" }
  - { name: "Accenture", ats: company_site, careers_url: "https://www.accenture.com/us-en/careers" }

  # ---- Tech (Boston-founded, hiring nationally and remote) ----
  - { name: "HubSpot", ats: greenhouse, token: "hubspotjobs" }
  - { name: "Klaviyo", ats: greenhouse, token: "klaviyo" }
  # DraftKings careers site 403s crawlers; its real ATS is Workday (found 2026-08-14).
  - { name: "DraftKings", ats: workday, tenant: "draftkings", wd: "wd1", site: "DraftKings" }
  - { name: "Toast", ats: greenhouse, token: "toast" }
  - { name: "Chewy", ats: phenom, base_url: "https://careers.chewy.com", tags: [fortune500] }
  - { name: "Datadog", ats: greenhouse, token: "datadog" }

  # ---- Big Tech ----
