# Company career-site registry. One line per company; the connector for its ATS
# does the rest. Grow this list by hand or with:  pnpm scrape:discover
#
# Fields per ATS:
#   greenhouse / lever / ashby / workable / recruitee / smartrecruiters: token
#   workday: tenant, wd (wd1/wd2/wd3/wd5), site
#   phenom: base_url
#   company_site (generic JSON-LD crawler): careers_url
#
# Entries failing verification are skipped at runtime with a logged warning —
# a wrong token never breaks the run.

companies:
  # ---- Big 4 / consulting ----
  - { name: "PwC", ats: phenom, base_url: "https://jobs-us.pwc.com" }
  - { name: "Deloitte", ats: company_site, careers_url: "https://apply.deloitte.com/en_US/careers" }
  - { name: "EY", ats: company_site, careers_url: "https://careers.ey.com/ey/search/?q=analyst" }
