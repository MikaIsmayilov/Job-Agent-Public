# Regional company pack: Canada. Loaded only when config.yml `ats.regions`
# includes "canada". Same fields as scraper/companies.yml.
#
# Every board was verified against its public API on 2026-10-22 and had live
# Canadian postings that day. Big banks, insurers and telcos (RBC, TD, BMO,
# CIBC, Scotiabank, Sun Life, Telus, Rogers, Bell) run Workday or SuccessFactors
# sites whose tenant names cannot be guessed reliably; their postings arrive
# through the LinkedIn / Indeed Canada scrape, and `pnpm scrape:discover`
# proposes their direct boards once a posting links to one. Manulife's
# Workday board is in the core list and carries Toronto roles.

companies:
